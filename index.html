    <script type="text/javascript">
      // 1. Dynamic base href calculation for GitHub Pages & custom domains
      (function() {
        var l = window.location;
        var baseHref = l.origin + '/';
        if (l.hostname.endsWith('github.io')) {
          var parts = l.pathname.split('/').filter(Boolean);
          if (parts.length > 0) {
            baseHref = l.origin + '/' + parts[0] + '/';
          }
        }
        document.write('<base href="' + baseHref + '">');
      })();

      // 2. GitHub Pages SPA router redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        // Trailing slash fix for GitHub Pages repository root to prevent broken relative asset paths
        if (l.hostname.endsWith('github.io') && l.pathname.split('/').filter(Boolean).length === 1 && !l.pathname.endsWith('/')) {
          window.location.replace(l.origin + l.pathname + '/' + l.search + l.hash);
        }
      }(window.location));
    </script>
