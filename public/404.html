<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>ZORK CRAFT — جاري التحويل</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query parameter (or hash), and redirects to the index.html page
      var pathSegmentsToKeep = 1; // 1 for project pages (https://<username>.github.io/<repo>/)

      var l = window.location;
      // If we are on custom domain or root domain, pathSegmentsToKeep is 0
      if (l.hostname === 'localhost' || l.hostname.indexOf('.run.app') !== -1 || l.hostname.split('.').length === 2) {
        pathSegmentsToKeep = 0;
      }

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #07070B; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>جاري تحويلك إلى منصة ZORK CRAFT...</p>
  </body>
</html>
